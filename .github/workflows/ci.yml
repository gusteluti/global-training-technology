# SG0 (D109): CI minimo do repositorio publico.
# Regras: so `pull_request` e `push`, permissao de leitura, nenhum segredo do repositorio.
name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      # Informativo: a main tem 13 falhas conhecidas (D107). Nao bloqueia o PR.
      - name: Suite completa (informativa)
        working-directory: backend
        continue-on-error: true
        run: python -m pytest
      # Obrigatorio: so os testes novos de seguranca (SG0 em diante).
      - name: Testes de seguranca (obrigatorio)
        working-directory: backend
        run: python -m pytest tests/test_sg*.py

  auditoria-dependencias:
    name: Auditoria de dependencias (relatorio)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Relatorio por enquanto (continue-on-error); o endurecimento esta registrado nas pendencias.
      - name: pip-audit
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - name: Instalar dependencias do frontend
        working-directory: frontend
        run: npm ci
      - name: npm audit
        working-directory: frontend
        continue-on-error: true
        run: npm audit --omit=dev

  segredos:
    name: Segredos no diff do PR
    runs-on: ubuntu-latest
    # Sem faixa de commits o CLI varre o historico inteiro (segredos antigos aceitos, D109).
    # Por isso so roda em pull_request, com a faixa base..head.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Baixar o CLI (versao fixa, checksum conferido)
        env:
          GL_URL: https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          GL_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          curl -sSfL "$GL_URL" -o "$RUNNER_TEMP/gl.tgz"
          echo "$GL_SHA256  $RUNNER_TEMP/gl.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gl"
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP/gl"
      - name: Varrer so os commits do PR
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          "$RUNNER_TEMP/gl/gitleaks" git --redact --no-banner --log-opts "origin/${BASE_REF}..HEAD" .
