<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Definir senha</h4>

        <div *ngIf="success" class="alert alert-success">
          Senha definida. Você já pode entrar.
          <a routerLink="/" class="alert-link">Ir para o login</a>
        </div>

        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

        <form *ngIf="!success" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label">Nova senha (mínimo 8 caracteres)</label>
            <input type="password" class="form-control" [(ngModel)]="password" name="password" required />
          </div>
          <button class="btn btn-primary" type="submit" [disabled]="enviando">Definir senha</button>
        </form>
      </div>
    </div>
  </div>
</div>
