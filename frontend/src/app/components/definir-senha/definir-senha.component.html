<div class="gt-auth">
  <div>
    <div class="card gt-auth-card">
      <div class="card-body">
        <h1 class="card-title gt-auth-titulo">Definir senha</h1>

        <div *ngIf="success" class="alert alert-success">
          Senha definida. Você já pode entrar.
          <a routerLink="/" class="alert-link">Ir para o login</a>
        </div>

        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

        <div *ngIf="linkInvalido" class="alert alert-warning" data-testid="definir-link-invalido">
          {{ avisoLinkInvalido }}
          <a routerLink="/esqueci-senha" class="alert-link ms-1" data-testid="definir-pedir-novo">Pedir um novo link</a>
        </div>

        <form *ngIf="!success && !verificando && !linkInvalido" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label">Nova senha</label>
            <input type="password" class="form-control" [(ngModel)]="password" name="password" required autocomplete="new-password" minlength="8" />
            <div class="form-text">Use pelo menos 8 caracteres.</div>
          </div>
          <button class="btn btn-primary" type="submit" [disabled]="enviando">Definir senha</button>
        </form>
      </div>
    </div>
  </div>
</div>
