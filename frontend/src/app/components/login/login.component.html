<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h1 class="card-title h4">Acessar Plataforma</h1>

        <div *ngIf="aviso" class="alert alert-warning" data-testid="login-sessao-expirada">{{ aviso }}</div>
        <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

        <form (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label" for="login-email">E-mail</label>
            <input id="login-email" class="form-control" [(ngModel)]="email" name="email" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="login-senha">Senha</label>
            <input id="login-senha" type="password" class="form-control" [(ngModel)]="password" name="password" required />
          </div>
          <button class="btn btn-primary" type="submit">Entrar</button>
          <a routerLink="/esqueci-senha" class="btn btn-link" data-testid="esqueci-link">Esqueci minha senha</a>
        </form>

        <hr class="my-3" />
        <p class="mb-2 text-muted">Ainda não tem uma conta?</p>
        <a routerLink="/cadastro" [queryParams]="nextInterno ? { next: nextInterno } : null"
           class="btn btn-outline-primary w-100" data-testid="cadastro-link">
          Criar conta e matricular-se
        </a>
      </div>
    </div>
  </div>
</div>
