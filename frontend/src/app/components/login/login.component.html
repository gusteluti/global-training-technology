<div class="gt-auth">
  <div class="card gt-auth-card">
    <div class="card-body">
      <h1 class="card-title gt-auth-titulo">Entrar na plataforma</h1>
      <p class="gt-auth-sub">Acesse seus cursos, pagamentos e certificados.</p>

      <div *ngIf="aviso" class="alert alert-warning" data-testid="login-sessao-expirada" role="status">{{ aviso }}</div>
      <div *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</div>

      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label" for="login-email">E-mail</label>
          <input id="login-email" type="email" class="form-control" [(ngModel)]="email" name="email" required
                 autocomplete="username" inputmode="email" spellcheck="false" />
        </div>
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-baseline">
            <label class="form-label" for="login-senha">Senha</label>
            <a routerLink="/esqueci-senha" class="gt-auth-link-pequeno" data-testid="esqueci-link">Esqueci minha senha</a>
          </div>
          <div class="gt-senha">
            <input id="login-senha" [type]="mostrarSenha ? 'text' : 'password'" class="form-control" [(ngModel)]="password"
                   name="password" required autocomplete="current-password" />
            <button type="button" class="gt-senha-olho" (click)="mostrarSenha = !mostrarSenha"
                    [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
                    [attr.aria-pressed]="mostrarSenha" data-testid="senha-mostrar">
              <svg *ngIf="!mostrarSenha" class="gt-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="mostrarSenha" class="gt-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 4.2A10.4 10.4 0 0 1 12 4c6.5 0 10 8 10 8a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6C3.7 8.6 2 12 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2M2 2l20 20"/></svg>
            </button>
          </div>
        </div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="enviando">
          {{ enviando ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>

      <div class="gt-auth-divisor"><span>Ainda não tem uma conta?</span></div>
      <a routerLink="/cadastro" [queryParams]="nextInterno ? { next: nextInterno } : null"
         class="btn btn-outline-primary w-100" data-testid="cadastro-link">
        Criar conta e matricular-se
      </a>
    </div>
  </div>
</div>
