<div class="gt-auth">
  <div>
    <div class="card gt-auth-card">
      <div class="card-body">
        <h1 class="card-title gt-auth-titulo">Esqueci minha senha</h1>
        <p class="gt-auth-sub">Informe o e-mail da sua conta. Enviaremos um link para criar uma senha nova.</p>

        <div *ngIf="mensagem" class="alert alert-success" data-testid="esqueci-mensagem">{{ mensagem }}</div>
        <div *ngIf="erro" class="alert alert-danger" data-testid="esqueci-erro">{{ erro }}</div>

        <form (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" [(ngModel)]="email" name="email" required autocomplete="email" spellcheck="false" data-testid="esqueci-email" />
          </div>
          <button class="btn btn-primary" type="submit" [disabled]="enviando" data-testid="esqueci-enviar">Enviar link</button>
          <a routerLink="/" class="btn btn-link">Voltar ao login</a>
        </form>
      </div>
    </div>
  </div>
</div>
