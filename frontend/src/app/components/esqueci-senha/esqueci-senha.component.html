<div class="row justify-content-center mt-5">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h4 class="card-title">Esqueci minha senha</h4>

        <div *ngIf="mensagem" class="alert alert-success" data-testid="esqueci-mensagem">{{ mensagem }}</div>
        <div *ngIf="erro" class="alert alert-danger" data-testid="esqueci-erro">{{ erro }}</div>

        <form (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control" [(ngModel)]="email" name="email" required data-testid="esqueci-email" />
          </div>
          <button class="btn btn-primary" type="submit" [disabled]="enviando" data-testid="esqueci-enviar">Enviar link</button>
          <a routerLink="/" class="btn btn-link">Voltar ao login</a>
        </form>
      </div>
    </div>
  </div>
</div>
