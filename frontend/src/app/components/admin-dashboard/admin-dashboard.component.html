<h3 class="mb-3">Painel administrativo</h3>

<ul class="nav nav-tabs mb-3">
  <li class="nav-item" *ngFor="let tab of visibleTabs">
    <button type="button" class="nav-link" [class.active]="activeTab === tab.key" (click)="select(tab.key)">
      {{ tab.label }}
    </button>
  </li>
</ul>

<app-financial-dashboard *ngIf="activeTab === 'financeiro'"></app-financial-dashboard>
<app-students-dashboard *ngIf="activeTab === 'alunos'"></app-students-dashboard>
<app-courses-dashboard *ngIf="activeTab === 'cursos'"></app-courses-dashboard>
<app-course-admin *ngIf="activeTab === 'cadastro-cursos'"></app-course-admin>
<app-ai-observability *ngIf="activeTab === 'ia'"></app-ai-observability>
<app-audit-logs *ngIf="activeTab === 'auditoria'"></app-audit-logs>

<div class="alert alert-warning" *ngIf="visibleTabs.length === 0">
  Seu perfil não tem acesso a nenhum painel administrativo.
</div>
